name: Crunchyroll history probe (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marquee-crunchyroll-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect history coverage without database access
        run: python3 scripts/crunchyroll/history_probe.py
        env:
          CRUNCHYROLL_ETP_RT: ${{ secrets.CRUNCHYROLL_ETP_RT }}
