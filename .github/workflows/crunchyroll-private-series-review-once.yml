name: Crunchyroll private series review (one-time)
on:
  push:
    paths:
      - .github/workflows/crunchyroll-private-series-review-once.yml
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'ddibara5/marquee' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Postgres driver
        run: pip install 'psycopg[binary]==3.3.6'
      - name: Install temporary report recipient certificate
        run: |
          cat >/tmp/marquee-review-recipient.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDMTCCAhmgAwIBAgIUXH7qn/Et6/kPLdNQf7ARVLNhtgcwDQYJKoZIhvcNAQEL
          BQAwKDEmMCQGA1UEAwwdTWFycXVlZSBwcml2YXRlIHNlcmllcyByZXZpZXcwHhcN
          MjYwOTI0MDIzNjMzWhcNMjYwOTI1MDIzNjMzWjAoMSYwJAYDVQQDDB1NYXJxdWVl
          IHByaXZhdGUgc2VyaWVzIHJldmlldzCCASIwDQYJKoZIhvcNAQEBBQADggEPADCC
          AQoCggEBAKc4ovEBMYzXagwfM59AxMxDPwwKRSDN5oObYQeYEojEgIa+Gyd9c+wI
          fiBnB5Xzo/wtkYaLKv7pqk7QsUD7X48154mHTpwMVAG3XdyLw2hFYDBzlixlrcv4
          +Owcm6GdIqmOOH+tFudq46IhYhcc3UnMpX36KbqiAKFA07ARNEmH2oDLx+Ka16gw
          QXoEZ17WGc2c80frIRFu4mzqtVu2/rrxK2PchQlpnW8UfciKqxGA7bpKennpxBlt
          liEhzaNW48SXzfMjsua1V3dniS6UKXA3JsORf5iKV1J502mNRBU3RW6cr0fo5CwI
          uDN1Wr9WkJBMjUAwytpMOJgpMv9DWjcCAwEAAaNTMFEwHQYDVR0OBBYEFA0SArVQ
          h9GJz264QxihnLEexo/DMB8GA1UdIwQYMBaAFA0SArVQh9GJz264QxihnLEexo/D
          MA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAGODQE5nJzGkm4ph
          kRvwB/RwG1jQd9RA41DWzQxdKlb851Nfw3tD8uNM/fBTYA3EGBfO46CshJn9CDwv
          +wowEiQhwqdsV71Vvu/fVFg3xchs7tVqiMVn95eh3Rbctd42D7lcXiYUrLGhvdA2
          cfqPciJlnpurMNBnDoO7kUks35WITGA/K9A6V1pXzgXnPUHOPylGMVwKg4uMiSqk
          2jdIqsG/0Gjm6CW7WV1hvk6GfAEoBqhKMf7oDO/bGjfXYUPMzanAUpdsW0qudFbP
          N4fJwg1pfkwpmH0KRgaOCEqFeH55k4OrDhfaYOsJx571aD6h0uMTZIzoX4rohqxT
          8gJ816w=
          -----END CERTIFICATE-----
          CERT
      - name: Encrypt named series mapping review before logging
        env:
          MARQUEE_DATABASE_URL: ${{ secrets.MARQUEE_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo 'ENCRYPTED_REVIEW_BEGIN'
          python3 - <<'PY' | openssl cms -encrypt -binary -aes-256-cbc -outform DER /tmp/marquee-review-recipient.pem | openssl base64 -A
          import json
          import os
          import sys
          from collections import defaultdict

          sys.path.insert(0, 'scripts/crunchyroll')
          from staged_review import source_snapshot, ReviewError
          from season_review_queue import prepare
          from anilist_episode_evidence import anilist_metadata, canonical_show_targets, series_proposals

          try:
              scope = 'c566e7e0-880a-430d-85df-c40484144a91'
              db = os.environ['MARQUEE_DATABASE_URL']
              records, seasons, _, _ = source_snapshot(db, scope)
              rows, _ = prepare(records, seasons)
              if len(records) != 7933 or len(rows) != 222:
                  raise ReviewError('Snapshot changed')
              season_ids = {c['canonical_season_id'] for row in rows.values() for c in row['candidates']}
              targets = canonical_show_targets(db, season_ids)
              media_ids = {c['anilist_media_id'] for row in rows.values() if len(row['candidates']) == 1 for c in row['candidates']}
              metadata = anilist_metadata(media_ids)
              safe, counts = series_proposals(records, rows, metadata, targets)
              if counts != {'exact_linked_series': 10, 'excluded_conflicting_show_candidates': 1,
                            'excluded_parent_series_mismatch': 0, 'series_with_unambiguous_show_target': 9}:
                  raise ReviewError('Proposal changed')
              by_season = {}
              titles = defaultdict(set)
              for event in records:
                  panel = event.get('panel')
                  episode = panel.get('episode_metadata') if isinstance(panel, dict) else None
                  if not isinstance(episode, dict):
                      continue
                  series = episode['series_id']
                  season = episode['season_id']
                  if season in by_season and by_season[season] != series:
                      raise ReviewError('Source season crosses series')
                  by_season[season] = series
                  if isinstance(episode.get('series_title'), str) and episode['series_title'].strip():
                      titles[series].add(episode['series_title'].strip())
              exact = defaultdict(set)
              candidate_shows = defaultdict(set)
              for season, row in rows.items():
                  series = by_season[season]
                  for candidate in row['candidates']:
                      candidate_shows[series].add(targets[candidate['canonical_season_id']])
                  if len(row['candidates']) == 1:
                      candidate = row['candidates'][0]
                      media = int(candidate['anilist_media_id'])
                      if metadata[media][2] == {series}:
                          exact[series].add(media)
              if len(exact) != 10 or len(set(exact)-set(safe)) != 1:
                  raise ReviewError('Exact links changed')
              import psycopg
              with psycopg.connect(db, connect_timeout=15) as conn:
                  with conn.cursor() as cur:
                      cur.execute('set transaction read only')
                      cur.execute("select count(*) from public.marquee_source_mappings where source='crunchyroll'")
                      if cur.fetchone()[0]:
                          raise ReviewError('Mappings changed')
                      cur.execute('select id::text, display_title from public.marquee_titles where id=any(%s::uuid[])',
                                  (list({s for key in exact for s in candidate_shows[key]}),))
                      show_names = dict(cur.fetchall())
              if any(not titles[key] or any(s not in show_names for s in candidate_shows[key]) for key in exact):
                  raise ReviewError('Review names incomplete')
              proposed = [{'crunchyroll_series_id': key, 'crunchyroll_names': sorted(titles[key]),
                           'marquee_show': show_names[safe[key]], 'marquee_show_id': safe[key],
                           'anilist_ids_with_exact_series_link': sorted(exact[key])}
                          for key in sorted(safe)]
              conflict = [{'crunchyroll_series_id': key, 'crunchyroll_names': sorted(titles[key]),
                           'candidate_shows': sorted(show_names[s] for s in candidate_shows[key]),
                           'anilist_ids_with_exact_series_link': sorted(exact[key])}
                          for key in sorted(set(exact)-set(safe))]
              print(json.dumps({'proposed': proposed, 'conflicting': conflict}, ensure_ascii=False))
          except Exception:
              print('Private series review failed without exposing records', file=sys.stderr)
              sys.exit(1)
          PY
          echo
          echo 'ENCRYPTED_REVIEW_END'
