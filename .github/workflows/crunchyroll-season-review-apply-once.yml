name: Crunchyroll season candidate apply (one-time)
on:
  push:
    paths:
      - .github/workflows/crunchyroll-season-review-apply-once.yml

permissions:
  contents: read

concurrency:
  group: marquee-crunchyroll-season-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'ddibara5/marquee' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Postgres driver
        run: pip install "psycopg[binary]==3.3.6"
      - name: Populate private season review candidates
        run: python3 scripts/crunchyroll/season_review_queue.py --user-id c566e7e0-880a-430d-85df-c40484144a91 --apply-review
        env:
          MARQUEE_DATABASE_URL: ${{ secrets.MARQUEE_DATABASE_URL }}
