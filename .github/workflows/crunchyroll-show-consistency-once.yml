name: Crunchyroll canonical show consistency (one-time)
on:
  push:
    paths:
      - .github/workflows/crunchyroll-show-consistency-once.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ddibara5/marquee' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Postgres driver
        run: pip install "psycopg[binary]==3.3.6"
      - name: Check series to canonical show targets
        run: python3 scripts/crunchyroll/anilist_episode_evidence.py --user-id c566e7e0-880a-430d-85df-c40484144a91
        env:
          MARQUEE_DATABASE_URL: ${{ secrets.MARQUEE_DATABASE_URL }}
