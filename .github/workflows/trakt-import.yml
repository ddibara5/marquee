name: Trakt sync (manual recovery)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate Trakt pages without database writes
        type: boolean
        default: true
      refresh_now:
        description: Rotate Trakt tokens now to verify refresh (requires redirect URI variable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marquee-trakt-oauth
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: pip install "psycopg[binary]==3.3.6"
      - name: Run Trakt import
        shell: bash
        run: |
          args=(--user-id c566e7e0-880a-430d-85df-c40484144a91
                --approved-shows scripts/trakt-sync/approved_non_anime_shows.json)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python3 scripts/trakt-sync/run_with_oauth.py "${args[@]}"
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REFRESH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_now }}
          TRAKT_OAUTH_BUNDLE: ${{ secrets.TRAKT_OAUTH_BUNDLE }}
          TRAKT_MARQUEE_CLIENT_ID: ${{ secrets.TRAKT_MARQUEE_CLIENT_ID }}
          TRAKT_MARQUEE_CLIENT_SECRET: ${{ secrets.TRAKT_MARQUEE_CLIENT_SECRET }}
          TRAKT_MARQUEE_REDIRECT_URI: ${{ vars.TRAKT_MARQUEE_REDIRECT_URI }}
          GH_TOKEN: ${{ secrets.MARQUEE_SECRETS_WRITE_TOKEN }}
          MARQUEE_DATABASE_URL: ${{ secrets.MARQUEE_DATABASE_URL }}
