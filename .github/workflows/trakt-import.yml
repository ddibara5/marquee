name: Trakt import (manual)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: pip install "psycopg[binary]==3.3.6"
      - name: Run Trakt import
        run: >-
          python3 scripts/trakt-sync/run_with_oauth.py
          --user-id c566e7e0-880a-430d-85df-c40484144a91
          --approved-shows scripts/trakt-sync/approved_non_anime_shows.json
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_OAUTH_BUNDLE: ${{ secrets.TRAKT_OAUTH_BUNDLE }}
          MARQUEE_DATABASE_URL: ${{ secrets.MARQUEE_DATABASE_URL }}
